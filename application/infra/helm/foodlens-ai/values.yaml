global:
  environment: production
  domain: foodlens.example.com

replicaCount: 1

image:
  registry: docker.io
  repositoryPrefix: foodlens
  pullPolicy: IfNotPresent
  tag: "1.0.0"

secrets:
  databaseUrl: "postgresql://foodlens_user:foodlens_password@postgres:5432/foodlens_db?schema=public"
  redisUrl: "redis://redis:6379"
  rabbitmqUrl: "amqp://guest:guest@rabbitmq:5672"
  jwtAccessSecret: "super-secret-access-key-foodlens-2026"
  jwtRefreshSecret: "super-secret-refresh-key-foodlens-2026"

config:
  nodeEnv: "production"
  mockExternalServices: "true"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    frontend: "app.foodlens.example.com"
    gateway: "api.foodlens.example.com"

services:
  apiGateway:
    name: api-gateway
    port: 3000
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  authService:
    name: auth-service
    port: 3001
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  imageService:
    name: image-service
    port: 3002
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  foodService:
    name: food-service
    port: 3003
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  nutritionService:
    name: nutrition-service
    port: 3004
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  analysisService:
    name: analysis-service
    port: 3005
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  recommendationService:
    name: recommendation-service
    port: 3006
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  frontend:
    name: frontend
    port: 80
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
