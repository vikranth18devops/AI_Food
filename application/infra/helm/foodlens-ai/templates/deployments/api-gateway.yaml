apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foodlens-ai.fullname" . }}-api-gateway
  labels:
    app: api-gateway
    {{- include "foodlens-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.image.registry }}/{{ .Values.image.repositoryPrefix }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: {{ include "foodlens-ai.fullname" . }}-config
            - secretRef:
                name: {{ include "foodlens-ai.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.services.apiGateway.resources | nindent 12 }}
