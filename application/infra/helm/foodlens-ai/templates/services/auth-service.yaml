apiVersion: v1
kind: Service
metadata:
  name: {{ include "foodlens-ai.fullname" . }}-auth-service
  labels:
    app: auth-service
    {{- include "foodlens-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.authService.port }}
      targetPort: {{ .Values.services.authService.port }}
      protocol: TCP
      name: http
  selector:
    app: auth-service
