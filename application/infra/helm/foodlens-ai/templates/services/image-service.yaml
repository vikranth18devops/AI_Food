apiVersion: v1
kind: Service
metadata:
  name: {{ include "foodlens-ai.fullname" . }}-image-service
  labels:
    app: image-service
    {{- include "foodlens-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.imageService.port }}
      targetPort: {{ .Values.services.imageService.port }}
      protocol: TCP
      name: http
  selector:
    app: image-service
