apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodlens-ai-staging
  namespace: argocd
spec:
  project: foodlens-ai
  source:
    repoURL: 'https://github.com/your-org/AI_Food.git'
    targetRevision: release/staging
    path: infra/helm/foodlens-ai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: foodlens-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
