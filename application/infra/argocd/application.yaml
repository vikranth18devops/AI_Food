apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodlens-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foodlens-ai
  source:
    repoURL: 'https://github.com/your-org/AI_Food.git'
    targetRevision: HEAD
    path: infra/helm/foodlens-ai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: foodlens-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
